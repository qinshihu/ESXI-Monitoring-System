# Redis优化配置文件 - 为容器化ESXI监控系统设计

# 基本设置
port 6379
bind 0.0.0.0
protected-mode no

# 数据持久化 - 平衡性能和数据安全性
dir /data
dbfilename dump.rdb
rdbcompression yes
rdbchecksum yes
save 900 1  # 900秒内至少1个key被修改就触发持久化
save 300 10  # 300秒内至少10个key被修改就触发持久化
save 60 10000  # 60秒内至少10000个key被修改就触发持久化

# AOF持久化配置
aof-rewrite-incremental-fsync yes

# 内存管理 - 容器环境优化
maxmemory 512mb  # 设置最大内存限制
maxmemory-policy allkeys-lru  # 当内存不足时，移除最近最少使用的键
maxmemory-samples 5  # LRU算法采样数量，平衡精度和性能

# 连接管理 - 容器环境优化
tcp-keepalive 60  # 启用TCP keepalive，防止连接空闲断开
timeout 0  # 不自动关闭空闲客户端连接
maxclients 10000  # 最大客户端连接数

# 性能优化 - 容器环境专用
ios-threads 4  # 启用多线程I/O，提高性能
io-threads-do-reads yes

# 容器化环境特化配置
databases 1  # 减少数据库数量，降低内存占用
activedefrag no  # 容器环境中关闭主动碎片整理，减少CPU消耗

# 安全设置
requirepass ""  # 容器环境中通过网络隔离保证安全，不设置密码
disable-commands FLUSHDB FLUSHALL CONFIG DEBUG  # 禁用危险命令

# 日志配置
loglevel notice
logfile ""

# 容器环境信号处理优化
stop-writes-on-bgsave-error no  # 容器环境中允许在持久化错误时继续写入

# 容器健康检查支持
tcp-backlog 511  # 增加TCP连接队列大小